<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Pet Care Academy | Expert Guides</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        /* عداد الزيارات في أعلى يسار الشاشة */
        #visitor-counter {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1000;
        }
        .container { max-width: 1200px; margin: auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- عداد الزيارات -->
    <div id="visitor-counter">Visitors: <span id="count">0</span></div>

    <div class="container">
        <h1>Ultimate Pet Care Academy</h1>
        <div id="articles-container" class="grid">Loading expert guides...</div>
    </div>

    <script>
        // 1. محاكاة عداد الزيارات الحقيقي (يبدأ من قيمة فعلية محدثة)
        let count = localStorage.getItem('page_visits') || 0;
        count++;
        localStorage.setItem('page_visits', count);
        document.getElementById('count').innerText = count;

        // 2. جلب المقالات من ملف articles.json
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('articles-container');
                container.innerHTML = ''; 
                data.categories.forEach(cat => {
                    cat.articles.forEach(art => {
                        container.innerHTML += `
                            <div class="card">
                                <img src="${art.image}" alt="${art.title}">
                                <h3>${art.title}</h3>
                                <p>${art.summary}</p>
                            </div>
                        `;
                    });
                });
            })
            .catch(err => {
                console.error('Error loading articles:', err);
                document.getElementById('articles-container').innerText = "Articles loading...";
            });
    </script>
</body>
</html>

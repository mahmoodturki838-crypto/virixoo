<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Pet Care Academy | Expert Guides</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        #visitor-counter {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 8px 12px; border-radius: 5px; font-size: 11px; z-index: 1000;
            display: flex; gap: 10px; font-weight: bold;
        }
        .counter-item { color: #ffcc00; }
        .container { max-width: 1200px; margin: auto; padding: 60px 20px 20px 20px; }
        
        /* تصميم الشبكة (Grid) */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .card h3 { color: #333; margin-top: 0; cursor: pointer; transition: color 0.2s; }
        .card h3:hover { color: #007bff; }
        .card p { color: #555; line-height: 1.5; font-size: 14px; }
        
        .read-more { background: none; border: none; color: #007bff; font-weight: bold; cursor: pointer; padding: 0; margin-top: 10px; text-align: left; font-size: 14px; }
        .read-more:hover { text-decoration: underline; }

        /* نافذة قراءة المقال كاملة (Modal) */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #fff; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; border-radius: 8px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; font-weight: bold; color: #333; }
        .modal-content img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .modal-content h2 { color: #222; margin-top: 0; }
        .modal-content p { color: #444; line-height: 1.7; font-size: 16px; }

        /* زر بنترست */
        .pinterest-btn {
            display: inline-block; background: #bd081c; color: #fff;
            padding: 8px 15px; border-radius: 5px; text-decoration: none;
            font-weight: bold; font-size: 14px; margin-top: 20px;
        }
        .pinterest-btn:hover { background: #990614; }
    </style>
</head>
<body>

    <div id="visitor-counter">
        <span>D:<span class="counter-item" id="d-count">0</span></span>
        <span>M:<span class="counter-item" id="m-count">0</span></span>
        <span>Y:<span class="counter-item" id="y-count">0</span></span>
    </div>

    <div class="container">
        <h1>Ultimate Pet Care Academy</h1>
        <div id="articles-container" class="grid">Loading expert guides...</div>
    </div>

    <!-- نافذة عرض المقال الكامل -->
    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <a id="modal-pin" href="#" target="_blank" class="pinterest-btn">Pin to Pinterest</a>
        </div>
    </div>

    <script>
        // العداد
        let d = parseInt(localStorage.getItem('d_count') || 0) + 1;
        let m = parseInt(localStorage.getItem('m_count') || 0) + 1;
        let y = parseInt(localStorage.getItem('y_count') || 0) + 1;
        localStorage.setItem('d_count', d);
        localStorage.setItem('m_count', m);
        localStorage.setItem('y_count', y);
        document.getElementById('d-count').innerText = d;
        document.getElementById('m-count').innerText = m;
        document.getElementById('y-count').innerText = y;

        let allArticles = [];

        // جلب المقالات وعرضها كشبكة
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                allArticles = data.articles;
                const container = document.getElementById('articles-container');
                container.innerHTML = ''; 
                
                data.articles.forEach(art => {
                    container.innerHTML += `
                        <div class="card">
                            <div>
                                <img src="${art.image}" alt="${art.title}">
                                <h3 onclick="openArticle(${art.id})">${art.title}</h3>
                                <p>${art.summary}</p>
                            </div>
                            <button class="read-more" onclick="openArticle(${art.id})">Read More &rarr;</button>
                        </div>
                    `;
                });
            })
            .catch(err => console.error('Error loading articles:', err));

        // فتح المقال الكامل في نافذة منبثقة
        function openArticle(id) {
            const art = allArticles.find(a => a.id === id);
            if (!art) return;

            document.getElementById('modal-img').src = art.image;
            document.getElementById('modal-title').innerText = art.title;
            document.getElementById('modal-text').innerText = art.content;

            const currentUrl = window.location.href;
            const pinUrl = `https://pinterest.com/pin/create/button/?url=${encodeURIComponent(currentUrl)}&media=${encodeURIComponent(art.image)}&description=${encodeURIComponent(art.title + " - " + art.summary)}`;
            document.getElementById('modal-pin').href = pinUrl;

            document.getElementById('modal').style.display = 'flex';
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>

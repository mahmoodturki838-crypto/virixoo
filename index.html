<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Pet Care Academy | Expert Guides</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        /* تصميم العداد بشكل احترافي */
        #visitor-counter {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.85); color: #00ff00;
            padding: 10px; border-radius: 8px; font-size: 13px; z-index: 1000;
            line-height: 1.6; border: 1px solid #444;
        }
        .container { max-width: 1200px; margin: auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- عداد الزيارات المحدث -->
    <div id="visitor-counter">
        <div>Day (d): <span id="count-d">0</span></div>
        <div>Month (m): <span id="count-m">0</span></div>
        <div>Year (y): <span id="count-y">0</span></div>
    </div>

    <div class="container">
        <h1>Ultimate Pet Care Academy</h1>
        <div id="articles-container" class="grid">Loading expert guides...</div>
    </div>

    <script>
        // منطق تحديث العدادات الذكي
        const now = new Date();
        const dKey = `visits_d_${now.getDate()}_${now.getMonth()}_${now.getFullYear()}`;
        const mKey = `visits_m_${now.getMonth()}_${now.getFullYear()}`;
        const yKey = `visits_y_${now.getFullYear()}`;

        function updateCounter(key, elementId) {
            let count = parseInt(localStorage.getItem(key) || 0);
            count++;
            localStorage.setItem(key, count);
            document.getElementById(elementId).innerText = count;
        }

        updateCounter(dKey, 'count-d');
        updateCounter(mKey, 'count-m');
        updateCounter(yKey, 'count-y');

        // جلب المقالات من ملف articles.json
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('articles-container');
                container.innerHTML = ''; 
                data.categories.forEach(cat => {
                    cat.articles.forEach(art => {
                        container.innerHTML += `
                            <div class="card">
                                <img src="${art.image}" alt="${art.title}">
                                <h3>${art.title}</h3>
                                <p>${art.summary}</p>
                            </div>
                        `;
                    });
                });
            })
            .catch(err => console.error('Error loading articles:', err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Pet Care Academy | Expert Guides</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        #visitor-counter {
            position: fixed; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #fff;
            padding: 8px 12px; border-radius: 5px; font-size: 11px; z-index: 1000;
            display: flex; gap: 10px; font-weight: bold;
        }
        .counter-item { color: #ffcc00; }
        .container { max-width: 1000px; margin: auto; padding: 60px 20px 20px 20px; }
        .card { background: #fff; padding: 25px; margin-bottom: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .card h2 { color: #333; margin-top: 0; }
        .card p { color: #555; line-height: 1.6; font-size: 16px; }
        .keywords { font-size: 12px; color: #007bff; background: #e7f1ff; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        
        /* تصميم زر Pinterest */
        .pinterest-btn {
            display: inline-block; background: #bd081c; color: #fff;
            padding: 8px 15px; border-radius: 5px; text-decoration: none;
            font-weight: bold; font-size: 14px; margin-top: 15px;
            transition: background 0.3s;
        }
        .pinterest-btn:hover { background: #990614; }
    </style>
</head>
<body>

    <div id="visitor-counter">
        <span>D:<span class="counter-item" id="d-count">0</span></span>
        <span>M:<span class="counter-item" id="m-count">0</span></span>
        <span>Y:<span class="counter-item" id="y-count">0</span></span>
    </div>

    <div class="container">
        <h1>Ultimate Pet Care Academy</h1>
        <div id="articles-container">Loading expert guides...</div>
    </div>

    <script>
        // العداد
        let d = parseInt(localStorage.getItem('d_count') || 0) + 1;
        let m = parseInt(localStorage.getItem('m_count') || 0) + 1;
        let y = parseInt(localStorage.getItem('y_count') || 0) + 1;
        localStorage.setItem('d_count', d);
        localStorage.setItem('m_count', m);
        localStorage.setItem('y_count', y);
        document.getElementById('d-count').innerText = d;
        document.getElementById('m-count').innerText = m;
        document.getElementById('y-count').innerText = y;

        // جلب المقالات وزر Pinterest
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('articles-container');
                container.innerHTML = ''; 
                data.articles.forEach(art => {
                    const currentUrl = window.location.href;
                    const pinUrl = `https://pinterest.com/pin/create/button/?url=${encodeURIComponent(currentUrl)}&media=${encodeURIComponent(art.image)}&description=${encodeURIComponent(art.title + " - " + art.summary)}`;

                    container.innerHTML += `
                        <div class="card">
                            <img src="${art.image}" alt="${art.title}">
                            <span class="keywords">Keywords: ${art.keywords.join(', ')}</span>
                            <h2>${art.title}</h2>
                            <p><strong>Overview:</strong> ${art.summary}</p>
                            <p>${art.content}</p>
                            <a href="${pinUrl}" target="_blank" class="pinterest-btn">Pin to Pinterest</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error('Error loading articles:', err);
                document.getElementById('articles-container').innerText = "Error loading content.";
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Pet Care Academy | 1200+ Expert Guides</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Ultimate Pet Care Academy</h1>
        <div id="articles-container" class="grid">Loading expert guides...</div>
    </div>

    <script>
        fetch('articles.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('articles-container');
                container.innerHTML = ''; 
                data.categories.forEach(cat => {
                    cat.articles.forEach(art => {
                        container.innerHTML += `
                            <div class="card">
                                <img src="${art.image}" alt="${art.title}">
                                <h3>${art.title}</h3>
                                <p>${art.summary}</p>
                            </div>
                        `;
                    });
                });
            })
            .catch(err => console.error('Error loading articles:', err));
    </script>
</body>
</html>

```yaml
name: Test Gemini Article Generator

on:
  workflow_dispatch:

jobs:
  generate-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Virixoo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate one article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      - name: Check generated article
        run: |
          echo "Checking articles.json..."
          test -f src/data/articles.json
          node -e "const d=require('./src/data/articles.json'); console.log('Articles:', d.articles.length)"

      - name: Commit generated article
        run: |
          git config user.name "Virixoo Auto Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/articles.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "test: generate first Gemini article"
            git push
          fi
```
